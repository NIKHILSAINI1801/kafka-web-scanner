[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kafka-web-scanner"
dynamic = ["version"]
description = "KAFKA: a passive, permission-based website security configuration scanner (educational)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "KAFKA Project Contributors" }]
keywords = ["security", "scanner", "http-headers", "cookies", "cors", "passive", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "requests>=2.31",
    "urllib3>=2.2",
    "beautifulsoup4>=4.12",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff==0.17.4",
    "build>=1.2",
    "cryptography>=42",
]

[project.scripts]
kafka = "kafka.main:app"

[tool.setuptools.dynamic]
version = { attr = "kafka.__version__" }

[tool.setuptools.packages.find]
include = ["kafka*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Line length is enforced by `ruff format`; E501 would only flag long strings/comments.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer evaluates annotations at runtime, so Optional[...] is kept in the CLI module.
"kafka/main.py" = ["UP"]

[tool.ruff.lint.isort]
known-first-party = ["kafka"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true
